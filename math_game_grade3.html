<style>

  header {

  }

  .header-top {

  header h1 {

  /* ======= HISTORY ======= */
  .history-panel {
    background: var(--card);
    border-radius: var(--radius);

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .history-title { font-family: 'Fredoka One', cursive; font-size: 1.2rem; color: var(--text); }

  .history-clear:hover { color: var(--red); border-color: var(--red); }

  .history-summary {
    display: flex;
    gap: 14px;

  .dot.green { background: var(--green); }
  .dot.red   { background: var(--red); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;

    overflow-y: auto;
  }

  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 12px;
    background: #f9fafb;

    direction: ltr;
    animation: slideIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  .history-item.correct-row { background: #f0fdf4; }
  .history-item.wrong-row   { background: #fef2f2; }

  .history-icon { font-size: 1.1rem; flex-shrink: 0; }
  .history-q { font-family: 'Fredoka One', cursive; font-size: 1rem; color: var(--text); flex: 1; }
  .history-answer { font-size: 0.8rem; color: var(--muted); direction: rtl; white-space: nowrap; }
  .history-time { font-size: 0.72rem; color: #d1d5db; white-space: nowrap; }

  .history-empty { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 16px 0; }

  /* confetti */
  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
  .confetti-piece { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: confettiFall linear forwards; }

  /* ======= ANIMATIONS ======= */
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(16px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes bounce {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.15); }
    70%  { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-6px); }
    75%     { transform: translateX(6px); }
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  @keyframes glow {
    0%,100% { box-shadow: var(--shadow); }
    50%     { box-shadow: 0 0 40px rgba(34,197,94,0.35), var(--shadow); }
  }

  .card.glow { animation: glow 1s ease; }
  .streak-pop { animation: bounce 0.4s cubic-bezier(0.34,1.56,0.64,1); }
</style>

<body>

<!-- ===== WELCOME SCREEN ===== -->
<div id="welcomeScreen">
  <div class="welcome-emoji">🧮</div>
  <h1 class="welcome-title">משחק חשבון</h1>
  <p class="welcome-sub">כיתה ג' – תרגול מתמטיקה</p>

  <div class="welcome-card">
    <label for="nameInput">מי משחק היום?</label>
    <input type="text" class="name-input" id="nameInput" placeholder="כתוב/י את שמך..." maxlength="20" onkeydown="if(event.key===&#39;Enter&#39;) startGame()" autocomplete="off" fdprocessedid="kebpo5">
    <button class="start-btn" onclick="startGame()" fdprocessedid="cjzwrw">בואו נתחיל! 🚀</button>

    <div class="known-players" id="knownPlayers" style="display:none">
      <div class="known-players-label">או בחר/י שם מוכר:</div>
      <div class="player-chips" id="playerChips"></div>
    </div>
  </div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="gameScreen">
  <header>
    <div class="header-top">
      <h1>🧮 משחק חשבון</h1>
      <button class="switch-player-btn" onclick="switchPlayer()">החלף שחקן/ית 🔄</button>
    </div>
    <div class="player-greeting">שלום, <strong id="playerName"></strong>! 👋</div>
  </header>

  <div class="stats">
    <div class="stat-pill score">
      <span class="emoji">⭐</span>
      <span>ניקוד:</span>
      <span class="val" id="score">0</span>
    </div>
    <div class="stat-pill streak">
      <span class="emoji">🔥</span>
      <span>רצף:</span>
      <span class="val" id="streak">0</span>
    </div>
    <div class="stat-pill total">
      <span class="emoji">📝</span>
      <span>שאלות:</span>
      <span class="val" id="totalAnswered">0</span>
    </div>
  </div>

  <div class="difficulty">
    <button class="diff-btn easy active" onclick="setDifficulty(&#39;easy&#39;, this)">🟢 קל</button>
    <button class="diff-btn medium" onclick="setDifficulty(&#39;medium&#39;, this)">🟡 בינוני</button>
    <button class="diff-btn hard" onclick="setDifficulty(&#39;hard&#39;, this)">🔴 קשה</button>
  </div>

  <div class="card" id="card">
    <div class="medal" id="medal"></div>
    <div class="question-label">מה התשובה?</div>
    <div class="question-text" id="question">טוען...</div>

    <div class="input-row">
      <input type="number" class="answer-input" id="answerInput" placeholder="?" onkeydown="handleKey(event)" autocomplete="off">
      <button class="check-btn" onclick="checkAnswer()">בדוק ✔</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="correct-answer" id="correctAnswer"></div>
    <button class="next-btn" onclick="nextQuestion()">שאלה חדשה ➜</button>
  </div>

  <div class="history-panel">
    <div class="history-header">
      <div class="history-title">📋 היסטוריה</div>
      <button class="history-clear" onclick="clearHistory()">נקה היסטוריה</button>
    </div>
    <div class="history-summary" id="historySummary"></div>
    <div class="history-list" id="historyList">
      <div class="history-empty">עדיין אין שאלות. בהצלחה! 😊</div>
    </div>
  </div>
</div>

<div class="confetti-container" id="confetti"></div>

<script>
  let difficulty = 'easy';
  let score = 0;
  let streak = 0;
  let currentAnswer = 0;
  let currentQuestion = '';
  let answered = false;
  let playerName = '';
  const STORAGE_KEY = 'mathgame_v1';

  // ======= WELCOME =======
  function initWelcome() {
    const all = getAllPlayers();
    const chipsEl = document.getElementById('playerChips');
    const knownEl = document.getElementById('knownPlayers');
    chipsEl.innerHTML = '';
    if (all.length > 0) {
      knownEl.style.display = 'block';
      all.forEach(name => {
        const chip = document.createElement('button');
        chip.className = 'player-chip';
        chip.textContent = '👤 ' + name;
        chip.onclick = () => { document.getElementById('nameInput').value = name; startGame(); };
        chipsEl.appendChild(chip);
      });
    } else {
      knownEl.style.display = 'none';
    }
    setTimeout(() => document.getElementById('nameInput').focus(), 100);
  }

  function startGame() {
    const val = document.getElementById('nameInput').value.trim();
    if (!val) { document.getElementById('nameInput').focus(); return; }
    playerName = val;

    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';
    document.getElementById('playerName').textContent = playerName;

    score = 0; streak = 0;
    document.getElementById('score').textContent = 0;
    document.getElementById('streak').textContent = 0;

    // reset difficulty to easy
    difficulty = 'easy';
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.diff-btn.easy').classList.add('active');

    renderHistory();
    loadQuestion();
  }

  function switchPlayer() {
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('welcomeScreen').style.display = 'flex';
    document.getElementById('nameInput').value = '';
    initWelcome();
  }

  // ======= STORAGE =======
  function getAllPlayers() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return Object.keys(data).sort();
    } catch { return []; }
  }

  function getHistory(name) {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return data[name] || [];
    } catch { return []; }
  }

  function saveEntry(entry) {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (!data[playerName]) data[playerName] = [];
      data[playerName].unshift(entry);
      if (data[playerName].length > 100) data[playerName] = data[playerName].slice(0, 100);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e) {}
  }

  function clearHistory() {
    if (!confirm('למחוק את כל ההיסטוריה של ' + playerName + '?')) return;
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      delete data[playerName];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e) {}
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    const summEl = document.getElementById('historySummary');
    const history = getHistory(playerName);

    document.getElementById('totalAnswered').textContent = history.length;

    if (history.length === 0) {
      list.innerHTML = '<div class="history-empty">עדיין אין שאלות. בהצלחה! 😊</div>';
      summEl.innerHTML = '';
      return;
    }

    const correct = history.filter(h => h.correct).length;
    const wrong = history.length - correct;
    summEl.innerHTML =
      '<div class="hsumm"><div class="dot green"></div> ' + correct + ' נכון</div>' +
      '<div class="hsumm"><div class="dot red"></div> ' + wrong + ' שגוי</div>' +
      '<div class="hsumm" style="color:var(--muted)">סה"כ: ' + history.length + '</div>';

    list.innerHTML = history.map(function(h) {
      const answerText = h.correct
        ? '= ' + h.correctAnswer
        : 'ענית: ' + h.userAnswer + ' (נכון: ' + h.correctAnswer + ')';
      return '<div class="history-item ' + (h.correct ? 'correct-row' : 'wrong-row') + '">' +
        '<span class="history-icon">' + (h.correct ? '✅' : '❌') + '</span>' +
        '<span class="history-q">' + h.question + '</span>' +
        '<span class="history-answer">' + answerText + '</span>' +
        '<span class="history-time">' + h.time + '</span>' +
      '</div>';
    }).join('');
  }

  // ======= AUDIO =======
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx;
  function getCtx() { if (!actx) actx = new AudioCtx(); return actx; }

  function playTone(freq, type, duration, gainVal) {
    try {
      const ac = getCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(gainVal, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(); osc.stop(ac.currentTime + duration);
    } catch(e) {}
  }

  function playSuccess() {
    playTone(523,'sine',0.15,0.4);
    setTimeout(function(){ playTone(659,'sine',0.15,0.4); }, 120);
    setTimeout(function(){ playTone(784,'sine',0.25,0.4); }, 240);
  }

  function playError() {
    playTone(300,'sawtooth',0.15,0.3);
    setTimeout(function(){ playTone(220,'sawtooth',0.25,0.3); }, 120);
  }

  // ======= QUESTIONS =======
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function generateQuestion() {
    let q;
    do { q = tryGenerate(); } while (q.answer < 0);
    return q;
  }

  function tryGenerate() {
    if (difficulty === 'easy') {
      const a = rand(1,10), b = rand(1,10);
      if (Math.random() > 0.4) return { text: a + ' + ' + b + ' = ?', answer: a + b };
      const big = Math.max(a,b), small = Math.min(a,b);
      return { text: big + ' − ' + small + ' = ?', answer: big - small };
    }
    if (difficulty === 'medium') {
      const a = rand(1,9), b = rand(1,9), c = rand(1,9);
      const t = rand(0,2);
      if (t === 0) return { text: a + ' + ' + b + ' × ' + c + ' = ?', answer: a + b * c };
      if (t === 1) return { text: a + ' × ' + b + ' + ' + c + ' = ?', answer: a * b + c };
      return { text: a + ' × ' + b + ' − ' + c + ' = ?', answer: a * b - c };
    }
    const t = rand(0,2);
    if (t === 0) {
      const a = rand(1,9), b = rand(1,9), c = rand(1,9);
      return { text: '(' + a + ' + ' + b + ') × ' + c + ' = ?', answer: (a + b) * c };
    }
    if (t === 1) {
      const a = rand(2,9), b = rand(1,9), c = rand(1,9), d = rand(1,9);
      return { text: '(' + a + ' × ' + b + ') − (' + c + ' + ' + d + ') = ?', answer: (a * b) - (c + d) };
    }
    const a = rand(1,9), b = rand(1,9), c = rand(1,5), d = rand(1,9);
    return { text: '(' + a + ' + ' + b + ') × ' + c + ' − ' + d + ' = ?', answer: (a + b) * c - d };
  }

  function loadQuestion() {
    const q = generateQuestion();
    currentAnswer = q.answer;
    currentQuestion = q.text.replace(' = ?', '');
    answered = false;

    const qEl = document.getElementById('question');
    qEl.textContent = q.text;
    qEl.classList.remove('bounce');
    void qEl.offsetWidth;
    qEl.classList.add('bounce');

    const input = document.getElementById('answerInput');
    input.value = '';
    input.className = 'answer-input';
    input.disabled = false;
    input.focus();

    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('correctAnswer').textContent = '';
    updateMedal();
  }

  function checkAnswer() {
    if (answered) { nextQuestion(); return; }
    const input = document.getElementById('answerInput');
    const val = input.value.trim();
    if (val === '') { input.focus(); return; }

    const userAnswer = parseInt(val, 10);
    answered = true;
    input.disabled = true;

    const isCorrect = (userAnswer === currentAnswer);
    const fb = document.getElementById('feedback');
    const ca = document.getElementById('correctAnswer');

    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    saveEntry({ question: currentQuestion, userAnswer: userAnswer, correctAnswer: currentAnswer, correct: isCorrect, difficulty: difficulty, time: timeStr });

    if (isCorrect) {
      score++; streak++;
      input.classList.add('correct');
      fb.textContent = '✅ נכון! כל הכבוד!';
      fb.className = 'feedback correct';
      ca.textContent = '';
      const card = document.getElementById('card');
      card.classList.remove('glow');
      void card.offsetWidth;
      card.classList.add('glow');
      playSuccess();
      spawnConfetti();
    } else {
      streak = 0;
      input.classList.add('wrong');
      fb.textContent = '❌ לא נכון';
      fb.className = 'feedback wrong';
      ca.textContent = 'התשובה הנכונה היא: ' + currentAnswer;
      playError();
    }

    document.getElementById('score').textContent = score;
    const streakEl = document.getElementById('streak');
    streakEl.textContent = streak;
    streakEl.classList.remove('streak-pop');
    void streakEl.offsetWidth;
    if (streak > 0) streakEl.classList.add('streak-pop');
    updateMedal();
    renderHistory();
  }

  function nextQuestion() { loadQuestion(); }
  function handleKey(e) { if (e.key === 'Enter') checkAnswer(); }

  function setDifficulty(d, btn) {
    difficulty = d;
    document.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    streak = 0;
    document.getElementById('streak').textContent = 0;
    loadQuestion();
  }

  function updateMedal() {
    const m = document.getElementById('medal');
    if (streak >= 10) m.textContent = '🏆';
    else if (streak >= 5) m.textContent = '🥇';
    else if (streak >= 3) m.textContent = '⚡';
    else m.textContent = '';
  }

  function spawnConfetti() {
    const container = document.getElementById('confetti');
    container.innerHTML = '';
    const colors = ['#ff6b35','#4ecdc4','#ffe66d','#a855f7','#22c55e','#f472b6'];
    for (let i = 0; i < 40; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.top = '-10px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.width = (6 + Math.random() * 10) + 'px';
      piece.style.height = (6 + Math.random() * 10) + 'px';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      piece.style.animationDuration = (0.8 + Math.random() * 1.2) + 's';
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      container.appendChild(piece);
    }
    setTimeout(function(){ container.innerHTML = ''; }, 2500);
  }

  initWelcome();
</script>
